<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Prueba FPS - MediaPipe Pose Landmarker (lite)</title>
<style>
  html, body { margin: 0; padding: 0; background: #0b0f14; color: #e6edf3; font-family: system-ui, sans-serif; }
  #wrap { position: relative; width: 100vw; height: 100vh; overflow: hidden; }
  video, canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
  #hud {
    position: absolute; top: 0; left: 0; right: 0; z-index: 10;
    padding: 10px 12px; background: rgba(0,0,0,0.55);
    font-size: 14px; line-height: 1.5; white-space: pre-wrap;
  }
  #hud b { color: #4ade80; }
  #startBtn {
    position: absolute; z-index: 20; top: 50%; left: 50%; transform: translate(-50%,-50%);
    padding: 16px 24px; font-size: 18px; border-radius: 10px; border: none;
    background: #22c55e; color: #052e16; font-weight: 700;
  }
  #err { color: #f87171; }
</style>
</head>
<body>
<div id="wrap">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>
  <div id="hud">Cargando MediaPipe...</div>
  <button id="startBtn">Iniciar prueba de cámara</button>
</div>

<script type="module">
  import {
    PoseLandmarker,
    FilesetResolver,
  } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

  const hud = document.getElementById("hud");
  const video = document.getElementById("video");
  const canvas = document.getElementById("overlay");
  const ctx = canvas.getContext("2d");
  const startBtn = document.getElementById("startBtn");

  function log(msg) {
    hud.textContent = msg;
  }

  function deviceInfo() {
    return [
      `UA: ${navigator.userAgent}`,
      `Pantalla: ${window.innerWidth}x${window.innerHeight} @ dpr${window.devicePixelRatio}`,
      `Núcleos lógicos: ${navigator.hardwareConcurrency || "?"}`,
    ].join("\n");
  }

  let poseLandmarker = null;
  let delegateUsed = "?";

  async function initModel() {
    log("Descargando runtime WASM...\n" + deviceInfo());
    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );
    log("Descargando modelo pose_landmarker_lite...\n" + deviceInfo());
    try {
      poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
          delegate: "GPU",
        },
        runningMode: "VIDEO",
        numPoses: 1,
      });
      delegateUsed = "GPU (con fallback automático a CPU si no disponible)";
    } catch (e) {
      log("GPU delegate falló, reintentando con CPU...\n" + String(e));
      poseLandmarker = await PoseLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
          delegate: "CPU",
        },
        runningMode: "VIDEO",
        numPoses: 1,
      });
      delegateUsed = "CPU";
    }
  }

  async function initCamera() {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user", width: { ideal: 640 }, height: { ideal: 480 } },
      audio: false,
    });
    video.srcObject = stream;
    await video.play();
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
  }

  let frameCount = 0;
  let windowStart = performance.now();
  let lastFpsText = "midiendo...";
  let minFps = Infinity;
  let maxFps = 0;
  let samples = [];

  function drawLandmarks(result) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (!result.landmarks || result.landmarks.length === 0) return;
    const lm = result.landmarks[0];
    ctx.fillStyle = "#4ade80";
    for (const p of lm) {
      ctx.beginPath();
      ctx.arc(p.x * canvas.width, p.y * canvas.height, 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function loop() {
    if (!poseLandmarker || video.readyState < 2) {
      requestAnimationFrame(loop);
      return;
    }
    const ts = performance.now();
    const result = poseLandmarker.detectForVideo(video, ts);
    drawLandmarks(result);

    frameCount++;
    const elapsed = ts - windowStart;
    if (elapsed >= 500) {
      const fps = (frameCount / elapsed) * 1000;
      lastFpsText = fps.toFixed(1);
      samples.push(fps);
      if (samples.length > 40) samples.shift();
      minFps = Math.min(minFps, fps);
      maxFps = Math.max(maxFps, fps);
      frameCount = 0;
      windowStart = ts;

      const avg = samples.reduce((a, b) => a + b, 0) / samples.length;
      log(
        `<b>FPS actual: ${lastFpsText}</b>\n` +
          `Promedio (últimos ${samples.length * 0.5}s): ${avg.toFixed(1)}\n` +
          `Mínimo: ${minFps.toFixed(1)}  Máximo: ${maxFps.toFixed(1)}\n` +
          `Delegate: ${delegateUsed}\n` +
          `Modelo: pose_landmarker_lite (float16)\n` +
          `Pose detectada: ${result.landmarks.length > 0 ? "sí" : "no (fuera de cuadro / mala luz)"}\n\n` +
          deviceInfo()
      );
      hud.innerHTML = hud.textContent.replace(
        /FPS actual: [\d.]+/,
        `FPS actual: <b>${lastFpsText}</b>`
      );
    }
    requestAnimationFrame(loop);
  }

  startBtn.addEventListener("click", async () => {
    startBtn.style.display = "none";
    try {
      await initCamera();
      await initModel();
      log("Arrancando medición, dejá el teléfono quieto apuntando a una persona ~15 segundos...");
      requestAnimationFrame(loop);
    } catch (e) {
      log("");
      document.getElementById("hud").innerHTML =
        '<span id="err">Error: ' + String(e && e.message ? e.message : e) + "</span>\n\n" + deviceInfo();
    }
  });

  log("Tocá el botón para dar permiso de cámara y empezar.\n\n" + deviceInfo());
</script>
</body>
</html>
